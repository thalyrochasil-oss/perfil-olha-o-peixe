<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qual é o seu perfil no mar? | Olha o Peixe!</title>
<style>
:root{--navy:#12384a;--sea:#2b7180;--sand:#f4ead8;--cream:#fffaf1;--coral:#d66d4d;--ink:#18343f;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(160deg,#eef7f4 0%,var(--sand) 100%);min-height:100vh}.shell{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(760px,100%);background:rgba(255,250,241,.96);border-radius:28px;box-shadow:0 20px 60px rgba(18,56,74,.15);overflow:hidden;border:1px solid rgba(18,56,74,.08)}.top{padding:24px 28px 8px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:var(--navy);letter-spacing:.2px}.step{font-size:13px;color:#627981}.progress{height:7px;background:#e5ded2;margin:0 28px;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--sea),var(--coral));transition:.35s}.content{padding:34px 28px 30px}.eyebrow{text-transform:uppercase;letter-spacing:1.6px;font-size:12px;font-weight:800;color:var(--sea)}h1,h2{font-family:Georgia,serif;color:var(--navy);margin:10px 0 12px;line-height:1.08}h1{font-size:clamp(34px,7vw,58px)}h2{font-size:clamp(26px,5vw,40px)}p{line-height:1.55;color:#526b73}.hero{padding:36px 4px 20px}.seal{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:white;font-size:42px;box-shadow:0 12px 30px rgba(18,56,74,.18)}button{font:inherit}.start,.next,.share{border:0;border-radius:999px;background:var(--navy);color:white;padding:15px 23px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(18,56,74,.15)}.start:hover,.next:hover,.share:hover{transform:translateY(-1px)}.answers{display:grid;gap:11px;margin-top:24px}.answer{width:100%;text-align:left;padding:15px 17px;border:1.5px solid #d8d2c7;border-radius:16px;background:white;color:var(--ink);cursor:pointer;transition:.18s}.answer:hover{border-color:var(--sea);transform:translateY(-1px)}.answer.selected{border-color:var(--sea);background:#eaf5f3;box-shadow:0 0 0 2px rgba(43,113,128,.08)}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:26px}.back{border:0;background:transparent;color:#667d84;cursor:pointer;padding:12px}.hint{font-size:13px;color:#75878c;margin-top:10px}.result{text-align:center}.result .seal{margin:0 auto 18px;width:110px;height:110px;font-size:52px}.traits{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0}.pill{padding:8px 12px;border-radius:999px;background:#eaf5f3;color:var(--navy);font-weight:700;font-size:13px}.quote{background:white;border-radius:18px;padding:18px;margin:22px 0;border:1px solid #e4ddd2}.foot{text-align:center;font-size:12px;color:#71858a;padding:0 28px 24px}@media(max-width:520px){.shell{padding:0}.card{border-radius:0;min-height:100vh}.content{padding:30px 20px}.top{padding:20px 20px 8px}.progress{margin:0 20px}}
</style>
</head>
<body><main class="shell"><section class="card"><div class="top"><div class="brand">OLHA O PEIXE! 🐟</div><div class="step" id="step"></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="content" id="app"></div><div class="foot">Da pesca artesanal para a sua mesa.</div></section></main>
<script>
const profiles={canoa:{name:'Mestre da Canoa',icon:'⚓',traits:['Confiança','Qualidade','Escolhas certeiras'],text:'Você gosta de saber de onde vem o que coloca à mesa e valoriza qualidade, frescor e confiança. No seu barco, boas escolhas têm direção e procedência.'},explorador:{name:'Pescador Explorador',icon:'🎣',traits:['Curiosidade','Novos sabores','Receitas'],text:'Você gosta de descobrir novos sabores, testar receitas e variar o cardápio. Para você, cada pescado pode abrir uma nova experiência na cozinha.'},rede:{name:'Mestre da Rede',icon:'🪢',traits:['Praticidade','Objetividade','Bom custo-benefício'],text:'Você valoriza soluções que facilitem a rotina: preparo simples, compra fácil e comunicação objetiva. Sua rede precisa funcionar bem e sem complicação.'},guardiao:{name:'Guardião da Maré',icon:'🌊',traits:['Sustentabilidade','Cuidado','Impacto positivo'],text:'Você olha além do produto. Sustentabilidade, cuidado, origem e impacto social fazem diferença nas suas escolhas e aproximam você da pesca artesanal.'}};
const Q=[
{q:'O que mais conquista você na hora de escolher um pescado?',a:[['Sabor','canoa',2],['Qualidade e frescor','canoa',3],['Praticidade para preparar','rede',3],['Preço','rede',2],['Ser uma opção saudável/nutritiva','guardiao',2],['Experimentar algo diferente','explorador',3]]},
{q:'Na cozinha, quando o assunto é pescado, você é mais…',a:[['Quero algo rápido e fácil','rede',3],['Gosto de cozinhar e testar receitas','explorador',3],['Com uma boa receita, eu me arrisco','explorador',2],['Prefiro produtos que já venham praticamente prontos','rede',3],['Normalmente outra pessoa cozinha','canoa',1]]},
{q:'Quais opções mais fazem seus olhos brilharem?',multi:3,a:[['Filés de peixe','canoa',2],['Peixes inteiros ou em postas','canoa',2],['Camarão','canoa',1],['Siri','explorador',1],['Lula','explorador',2],['Polvo','explorador',2],['Ostras e mariscos','explorador',2],['Produtos prontos ou semiprontos','rede',2],['Gosto de experimentar novidades','explorador',3]]},
{q:'O que mais poderia fazer o pescado aparecer com mais frequência na sua casa?',a:[['Preços e promoções mais atrativos','rede',3],['Mais praticidade no preparo','rede',3],['Receitas e ideias para variar','explorador',3],['Kits e combos prontos','rede',2],['Mais variedade','explorador',2],['Conhecer melhor os pescados e como prepará-los','explorador',2],['Mais facilidade para comprar/receber','rede',2],['Já consumo na frequência que gostaria','canoa',2]]},
{q:'Qual dessas novidades você teria mais vontade de receber da Olha o Peixe!?',a:[['Promoções personalizadas','rede',2],['Receitas rápidas','explorador',2],['Kits e combos','rede',2],['Novidades de produtos','explorador',3],['Dicas de preparo','explorador',2],['Sugestões de produtos de acordo com meu gosto','canoa',2]]},
{q:'Quando você recebe uma mensagem mais longa no WhatsApp, o que geralmente acontece?',light:true,a:[['Geralmente leio','guardiao',1],['Leio quando tenho tempo','canoa',1],['Dou uma olhada rápida e vejo só o principal','rede',1],['Geralmente não tenho tempo para ler','rede',1],['Prefiro mensagens curtas e objetivas','rede',1]]},
{q:'Qual rede social você mais usa no dia a dia?',neutral:true,a:[['Facebook'],['Instagram'],['TikTok'],['LinkedIn'],['Outra'],['Não uso redes sociais com frequência']]},
{q:'Qual é a sua faixa etária?',neutral:true,a:[['Até 24 anos'],['25 a 34 anos'],['35 a 44 anos'],['45 a 54 anos'],['55 a 64 anos'],['65 anos ou mais'],['Prefiro não informar']]},
{q:'Quais desses atributos são mais importantes para você no consumo?',multi:2,a:[['Preço baixo','rede',2],['Sustentabilidade','guardiao',4],['Praticidade na compra','rede',2],['Atendimento personalizado','canoa',2],['Cuidado com embalagens e preparo','guardiao',3],['Causa social','guardiao',4],['Facilidade na compra','rede',2]]},
{q:'Em qual período você geralmente usa mais o WhatsApp?',neutral:true,a:[['De manhã'],['À tarde'],['À noite'],['Uso praticamente igual em todos os períodos'],['Não uso WhatsApp']]},
{q:'Quando uma empresa precisa falar com você, como você prefere receber o contato?',neutral:true,a:[['Mensagem de texto'],['Áudio'],['Ligação']]},
{q:'Quando recebe uma oferta de pescado, qual formato você prefere?',light:true,a:[['Oferta acompanhada de receita','explorador',1],['Oferta com texto curto','rede',1],['Oferta com imagem do peixe','canoa',1]]},
{q:'Com que frequência você gostaria de receber nossas novidades e os pescados disponíveis?',neutral:true,a:[['Toda semana'],['A cada 15 dias'],['Uma vez por mês'],['Apenas quando houver novidades ou promoções especiais'],['Prefiro não receber esse tipo de mensagem']]}
];
let i=-1,answers=Array(Q.length).fill(null);const app=document.getElementById('app'),bar=document.getElementById('bar'),step=document.getElementById('step');
function intro(){i=-1;step.textContent='';bar.style.width='0';app.innerHTML=`<div class="hero"><div class="seal">🐟</div><div class="eyebrow">Uma viagem pela pesca artesanal</div><h1>Qual é o seu papel nesse mar?</h1><p>Suas escolhas à mesa dizem muito sobre você. Em poucos minutos, descubra qual perfil da tripulação Olha o Peixe! mais combina com o seu jeito de comprar, cozinhar e se relacionar com o mar.</p><button class="start" onclick="go(0)">Descobrir meu perfil →</button><p class="hint">Leva cerca de 3 minutos.</p></div>`}
function go(n){i=n;if(i>=Q.length)return result();render()}
function render(){const x=Q[i];step.textContent=`${i+1} de ${Q.length}`;bar.style.width=`${((i+1)/Q.length)*100}%`;let selected=answers[i]||[];app.innerHTML=`<div class="eyebrow">Sua rota pelo mar</div><h2>${x.q}</h2>${x.multi?`<p class="hint">Escolha até ${x.multi} opções.</p>`:''}<div class="answers">${x.a.map((o,j)=>`<button class="answer ${selected.includes(j)?'selected':''}" onclick="pick(${j})">${o[0]}</button>`).join('')}</div><div class="actions"><button class="back" onclick="${i?'go('+(i-1)+')':'intro()'}">← Voltar</button>${x.multi?`<button class="next" onclick="next()">Continuar →</button>`:''}</div>`}
function pick(j){const x=Q[i];if(x.multi){let s=answers[i]||[];if(s.includes(j))s=s.filter(v=>v!==j);else if(s.length<x.multi)s=[...s,j];answers[i]=s;render()}else{answers[i]=[j];setTimeout(()=>go(i+1),180)}}
function next(){if(!answers[i]||!answers[i].length)return alert('Escolha pelo menos uma opção para continuar.');go(i+1)}
function result(){const s={canoa:0,explorador:0,rede:0,guardiao:0};Q.forEach((q,qi)=>(answers[qi]||[]).forEach(j=>{const o=q.a[j];if(o[1])s[o[1]]+=(o[2]||1)}));const key=Object.keys(s).sort((a,b)=>s[b]-s[a])[0],p=profiles[key];step.textContent='Seu perfil';bar.style.width='100%';app.innerHTML=`<div class="result"><div class="seal">${p.icon}</div><div class="eyebrow">A maré revelou</div><h2>Você é ${p.name}</h2><div class="traits">${p.traits.map(t=>`<span class="pill">${t}</span>`).join('')}</div><div class="quote"><p>${p.text}</p></div><p><strong>Eu sou ${p.name} — Tripulação Olha o Peixe! 🐟</strong></p><button class="share" onclick="share('${p.name}')">Compartilhar meu perfil</button> <button class="back" onclick="restart()">Refazer</button></div>`}
function share(name){const text=`Meu perfil na tripulação Olha o Peixe! é ${name} 🐟 Qual será o seu?`;if(navigator.share)navigator.share({title:'Meu perfil Olha o Peixe!',text,url:location.href});else navigator.clipboard.writeText(text+' '+location.href).then(()=>alert('Texto e link copiados!'))}
function restart(){answers=Array(Q.length).fill(null);intro()}intro();
</script></body></html>
