<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qual é o seu perfil no mar? | Olha o Peixe!</title><style>:root{--navy:#10394b;--sea:#287889;--cream:#fffaf2;--coral:#d86c4b;--ink:#183843;--muted:#667d83}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 12%,#dcefee 0,transparent 28%),linear-gradient(145deg,#f4eee2,#e7f3f1);min-height:100vh}.shell{min-height:100vh;display:grid;place-items:center;padding:26px}.card{position:relative;width:min(790px,100%);background:rgba(255,250,242,.97);border-radius:30px;box-shadow:0 22px 70px rgba(16,57,75,.16);overflow:hidden;border:1px solid rgba(16,57,75,.08)}.card:before,.card:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.card:before{width:190px;height:190px;background:rgba(40,120,137,.06);right:-90px;top:90px}.card:after{width:150px;height:150px;background:rgba(216,108,75,.05);left:-75px;bottom:35px}.top{position:relative;z-index:1;padding:18px 30px 10px;display:flex;justify-content:flex-end;min-height:28px}.step{font-size:13px;color:var(--muted);font-weight:700}.progress{height:7px;background:#e7dfd3;margin:0 30px;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--sea),var(--coral));transition:.35s}.content{position:relative;z-index:1;padding:34px 30px 32px}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-size:11px;font-weight:900;color:var(--sea)}h1,h2{font-family:Georgia,serif;color:var(--navy);margin:10px 0 13px;line-height:1.08}h1{font-size:clamp(35px,7vw,58px)}h2{font-size:clamp(27px,5vw,40px)}p{line-height:1.55;color:#526d75}.hero{padding:25px 5px 20px}.field-box{margin:18px 0;max-width:540px}.field-box label{display:block;font-weight:800;color:var(--navy);margin-bottom:8px}.field-input{width:100%;padding:15px 17px;border:1.5px solid #d8d0c4;border-radius:15px;background:#fff;font-size:16px;color:var(--ink);outline:none}.field-input:focus{border-color:var(--sea);box-shadow:0 0 0 3px rgba(40,120,137,.09)}.privacy-note{font-size:12px;color:#75878c;margin:10px 0 20px;max-width:540px}.start,.next,.share{border:0;border-radius:999px;background:var(--navy);color:white;padding:15px 23px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(16,57,75,.15)}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:24px}.answer{width:100%;text-align:left;padding:15px 16px;border:1.5px solid #ddd6ca;border-radius:17px;background:white;color:var(--ink);cursor:pointer;display:flex;gap:11px;align-items:center;min-height:58px}.answer:hover,.answer.selected{border-color:var(--sea)}.answer.selected{background:#eaf5f3}.choice-icon{width:31px;height:31px;border-radius:10px;background:#f5efe4;display:grid;place-items:center;flex:0 0 auto;font-size:17px}.brand-icon{font-family:Arial,sans-serif;font-weight:900;font-size:18px}.tiktok-icon{color:#111;text-shadow:-1px 0 #25f4ee,1px 0 #fe2c55}.whatsapp-icon{width:22px;height:22px;border-radius:50%;background:#25D366;color:white;display:grid;place-items:center;font-size:13px;font-weight:900}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:26px}.back{border:0;background:transparent;color:#667d84;cursor:pointer;padding:12px}.hint{font-size:13px;color:#75878c;margin-top:10px}.result{text-align:center}.profile-badge{margin:0 auto 18px;width:124px;height:124px;border-radius:34px;background:linear-gradient(145deg,#fff,#e7f3f1);border:1px solid #dce7e3;display:grid;place-items:center;font-size:63px;box-shadow:0 14px 32px rgba(16,57,75,.12)}.traits{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0}.pill{padding:8px 12px;border-radius:999px;background:#eaf5f3;color:var(--navy);font-weight:700;font-size:13px}.quote{background:white;border-radius:20px;padding:19px;margin:22px 0;border:1px solid #e4ddd2}.profile-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0}.profile-chip{background:white;border:1px solid #e4ddd2;border-radius:16px;padding:10px 5px;font-size:11px;font-weight:800;color:var(--navy)}.profile-chip span{display:block;font-size:24px;margin-bottom:5px}.foot{text-align:center;font-size:12px;color:#71858a;padding:0 28px 24px}@media(max-width:600px){.shell{padding:0}.card{border-radius:0;min-height:100vh}.content{padding:28px 20px}.top{padding:16px 20px 8px}.progress{margin:0 20px}.answers{grid-template-columns:1fr}.profile-strip{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="shell"><section class="card"><div class="top"><div class="step" id="step"></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="content" id="app"></div><div class="foot">Da pesca artesanal para a sua mesa.</div></section></main><script>const profiles={canoa:{name:'Mestre da Canoa',icon:'🧭',traits:['Confiança','Qualidade','Escolhas certeiras'],text:'Você gosta de saber de onde vem o que coloca à mesa e valoriza qualidade, frescor e confiança. No seu barco, boas escolhas têm direção e procedência.'},explorador:{name:'Pescador Explorador',icon:'🎣',traits:['Curiosidade','Novos sabores','Receitas'],text:'Você gosta de descobrir novos sabores, testar receitas e variar o cardápio. Para você, cada pescado pode abrir uma nova experiência na cozinha.'},rede:{name:'Mestre da Rede',icon:'🪢',traits:['Praticidade','Objetividade','Bom custo-benefício'],text:'Você valoriza soluções que facilitem a rotina: preparo simples, compra fácil e comunicação objetiva. Sua rede precisa funcionar bem e sem complicação.'},guardiao:{name:'Guardião da Maré',icon:'🌊',traits:['Sustentabilidade','Cuidado','Impacto positivo'],text:'Você olha além do produto. Sustentabilidade, cuidado, origem e impacto social fazem diferença nas suas escolhas e aproximam você da pesca artesanal.'}};const icons=['✨','🍳','🐟','🏠','🎁','💬','📱','◷','⚖️','☀️','☎️','🧾','📆'];const Q=[{q:'O que mais conquista você na hora de escolher um pescado?',a:[['Sabor','canoa',2],['Praticidade para preparar','rede',3],['Preço','rede',2],['Ser uma opção saudável/nutritiva','guardiao',2],['Experimentar algo diferente','explorador',3]]},{q:'Na cozinha, quando o assunto é pescado, você é mais…',a:[['Quero algo rápido e fácil','rede',3],['Gosto de cozinhar e testar receitas','explorador',3],['Com uma boa receita, eu me arrisco','explorador',2],['Prefiro produtos que já venham praticamente prontos','rede',3],['Normalmente outra pessoa cozinha','canoa',1]]},{q:'Quais opções mais fazem seus olhos brilharem?',multi:3,a:[['Filés de peixe','canoa',2],['Peixes inteiros ou em postas','canoa',2],['Camarão','canoa',1],['Siri','explorador',1],['Ostras e mariscos','explorador',2],['Produtos prontos ou semiprontos','rede',2]]},{q:'O que mais poderia fazer o pescado aparecer com mais frequência na sua casa?',a:[['Preços e promoções mais atrativos','rede',3],['Receitas e ideias para variar','explorador',3],['Kits e combos prontos','rede',2],['Mais variedade','explorador',2],['Já consumo na frequência que gostaria','canoa',2]]},{q:'Qual dessas novidades você teria mais vontade de receber da Olha o Peixe!?',a:[['Promoções personalizadas','rede',2],['Receitas rápidas','explorador',2],['Kits e combos','rede',2],['Novidades de produtos','explorador',3]]},{q:'Quando você recebe uma mensagem mais longa no WhatsApp, o que geralmente acontece?',light:true,a:[['Geralmente leio','guardiao',1],['Dou uma olhada rápida e vejo só o principal','rede',1],['Geralmente não tenho tempo para ler','rede',1],['Prefiro mensagens curtas e objetivas','rede',1]]},{q:'Qual rede social você mais usa no dia a dia?',neutral:true,a:[['Facebook'],['Instagram'],['TikTok'],['LinkedIn'],['WhatsApp'],['Não uso redes sociais com frequência']]},{q:'Qual é a sua faixa etária?',neutral:true,a:[['Até 24 anos'],['25 a 34 anos'],['35 a 44 anos'],['45 a 54 anos'],['55 a 64 anos'],['65 anos ou mais'],['Prefiro não informar']]},{q:'Quais desses atributos são mais importantes para você no consumo?',multi:2,a:[['Preço baixo','rede',2],['Sustentabilidade','guardiao',4],['Atendimento personalizado','canoa',2],['Cuidado com embalagens e preparo','guardiao',3],['Causa social','guardiao',4]]},{q:'Em qual período você geralmente usa mais o WhatsApp?',neutral:true,a:[['De manhã'],['À tarde'],['À noite'],['Uso praticamente igual em todos os períodos'],['Não uso WhatsApp']]},{q:'Quando uma empresa precisa falar com você, como você prefere receber o contato?',neutral:true,a:[['Mensagem de texto'],['Áudio'],['Ligação']]},{q:'Quando recebe uma oferta de pescado, qual formato você prefere?',light:true,a:[['Oferta acompanhada de receita','explorador',1],['Oferta com texto curto','rede',1],['Oferta com imagem do peixe','canoa',1]]},{q:'Com que frequência você gostaria de receber nossas novidades e os pescados disponíveis?',neutral:true,a:[['Toda semana'],['A cada 15 dias'],['Uma vez por mês'],['Apenas quando houver novidades ou promoções especiais'],['Prefiro não receber esse tipo de mensagem']]}];let i=-1,customerName='',customerPhone='',answers=Array(Q.length).fill(null);const app=document.getElementById('app'),bar=document.getElementById('bar'),step=document.getElementById('step');function esc(v){return v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}function intro(){i=-1;step.textContent='';bar.style.width='0';app.innerHTML=`<div class="hero"><div class="eyebrow">Uma viagem pela pesca artesanal</div><h1>Qual é o seu papel nesse mar?</h1><p>Suas escolhas à mesa dizem muito sobre você. Em poucos minutos, descubra qual perfil da tripulação Olha o Peixe! mais combina com o seu jeito de comprar, cozinhar e se relacionar com o mar.</p><div class="profile-strip"><div class="profile-chip"><span>🧭</span>Mestre da Canoa</div><div class="profile-chip"><span>🎣</span>Pescador Explorador</div><div class="profile-chip"><span>🪢</span>Mestre da Rede</div><div class="profile-chip"><span>🌊</span>Guardião da Maré</div></div><button class="start" onclick="identification()">Descobrir meu perfil →</button><p class="hint">Leva cerca de 3 minutos.</p></div>`}function identification(){step.textContent='Antes de começar';bar.style.width='0';app.innerHTML=`<div class="eyebrow">⚓ Antes de embarcar</div><h2>Conta pra gente quem está nessa viagem</h2><p>Preencha seus dados para começar a descobrir o seu perfil.</p><div class="field-box"><label for="customerName">Nome</label><input class="field-input" id="customerName" type="text" maxlength="80" placeholder="Digite seu nome" value="${esc(customerName)}"></div><div class="field-box"><label for="customerPhone">Telefone / WhatsApp</label><input class="field-input" id="customerPhone" type="tel" inputmode="tel" maxlength="20" placeholder="(41) 99999-9999" value="${esc(customerPhone)}"></div><p class="privacy-note">Usaremos seus dados e respostas para conhecer melhor suas preferências e melhorar sua experiência com a Olha o Peixe!</p><div class="actions"><button class="back" onclick="saveIdentification();intro()">← Voltar</button><button class="next" onclick="startQuiz()">Começar →</button></div>`}function saveIdentification(){const n=document.getElementById('customerName'),p=document.getElementById('customerPhone');if(n)customerName=n.value.trim();if(p)customerPhone=p.value.trim()}function startQuiz(){saveIdentification();if(!customerName)return alert('Digite seu nome para continuar.');if(!customerPhone)return alert('Digite seu telefone ou WhatsApp para continuar.');go(0)}function go(n){i=n;if(i>=Q.length)return result();render()}function render(){const x=Q[i];step.textContent=`${i+1} de ${Q.length}`;bar.style.width=`${((i+1)/Q.length)*100}%`;let selected=answers[i]||[];app.innerHTML=`<div class="eyebrow">${icons[i]} Sua rota pelo mar</div><h2>${x.q}</h2>${x.multi?`<p class="hint">Escolha até ${x.multi} opções.</p>`:''}<div class="answers">${x.a.map((o,j)=>`<button class="answer ${selected.includes(j)?'selected':''}" onclick="pick(${j})"><span class="choice-icon">${answerIcon(i,j)}</span><span>${o[0]}</span></button>`).join('')}</div><div class="actions"><button class="back" onclick="${i?'go('+(i-1)+')':'identification()'}">← Voltar</button>${x.multi?`<button class="next" onclick="next()">Continuar →</button>`:''}</div>`}function answerIcon(q,j){if(q===6&&j===2)return '<span class="brand-icon tiktok-icon">♪</span>';if(q===6&&j===4)return '<span class="whatsapp-icon">☎</span>';const sets=[['😋','⚡','💰','🌿','🔎'],['⚡','🍳','📖','👌','🏠'],['🐟','🐠','🦐','🦀','🦪','🍽️'],['💰','📖','📦','🐟','✓'],['🏷️','📖','📦','✨'],['📖','👀','⏱️','⚡'],['f','◎','•','in','•','—'],['◉','◉','◉','◉','◉','◉','—'],['💰','🌱','♥','📦','🤝'],['☀️','◐','🌙','◉','—'],['💬','🎙️','☎️'],['📖','✎','▣'],['7d','15d','30d','★','—']];return(sets[q]&&sets[q][j])||'•'}function pick(j){const x=Q[i];if(x.multi){let s=answers[i]||[];if(s.includes(j))s=s.filter(v=>v!==j);else if(s.length<x.multi)s=[...s,j];answers[i]=s;render()}else{answers[i]=[j];setTimeout(()=>go(i+1),180)}}function next(){if(!answers[i]||!answers[i].length)return alert('Escolha pelo menos uma opção para continuar.');go(i+1)}function result(){const s={canoa:0,explorador:0,rede:0,guardiao:0};Q.forEach((q,qi)=>(answers[qi]||[]).forEach(j=>{const o=q.a[j];if(o[1])s[o[1]]+=(o[2]||1)}));const key=Object.keys(s).sort((a,b)=>s[b]-s[a])[0],p=profiles[key];step.textContent='Seu perfil';bar.style.width='100%';app.innerHTML=`<div class="result"><div class="profile-badge">${p.icon}</div><div class="eyebrow">A maré revelou</div><h2>${esc(customerName)}, você é ${p.name}</h2><div class="traits">${p.traits.map(t=>`<span class="pill">${t}</span>`).join('')}</div><div class="quote"><p>${p.text}</p></div><p><strong>Eu sou ${p.name} — Tripulação Olha o Peixe! 🐟</strong></p><button class="share" onclick="share('${p.name}')">Compartilhar meu perfil</button> <button class="back" onclick="restart()">Refazer</button></div>`}function share(name){const text=`Meu perfil na tripulação Olha o Peixe! é ${name} 🐟 Qual será o seu?`;if(navigator.share)navigator.share({title:'Meu perfil Olha o Peixe!',text,url:location.href});else navigator.clipboard.writeText(text+' '+location.href).then(()=>alert('Texto e link copiados!'))}function restart(){answers=Array(Q.length).fill(null);customerName='';customerPhone='';intro()}intro();</script></body></html>
